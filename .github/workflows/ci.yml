name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholder values: the build validates env vars but never calls Supabase.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
      NEXT_PUBLIC_SITE_URL: https://ybankapp.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Non-blocking until the 120 pre-existing errors in src/ are cleaned up (Phase 1/3).
      # Flip to blocking by removing continue-on-error once `npm run lint` is clean.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build

  # End-to-end flows against a throwaway local Supabase (migrations + seed, no real data).
  # Not a required check yet: make it required in branch protection once it has been green for a while.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Start local Supabase
        run: npx supabase start

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: |
          export E2E_SUPABASE_PUBLISHABLE_KEY="$(npx supabase status -o json | jq -r .PUBLISHABLE_KEY)"
          npm run e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            e2e/.results/
          retention-days: 14
